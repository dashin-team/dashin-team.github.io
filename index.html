  setPart(W.acc,i,b,yaw,A[0],A[1],A[2],0,sc,A[3]);dm.position.copy(p);dm.position.y+=.003;dm.rotation.set(0,0,0);dm.scale.setScalar(sc);dm.updateMatrix();shadowM.setMatrixAt(i,dm.matrix)});

let minutes=600,paused=false;
function applyTime(min){min=Math.round(min/10)*10%1440;let i=0;while(KF[i+1][0]<min)i++;const a=KF[i],b=KF[i+1],t=(min-a[0])/(b[0]-a[0]||1);

 const tt=THREE.MathUtils.clamp((min-360)/720,0,1),az=Math.PI*(.15+.7*tt),el=.35+Math.sin(tt*Math.PI)*.75;
